<svg width="1600" height="800" viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hero-bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.95" />
    </linearGradient>
    
    <!-- Text Gradient for Name -->
    <linearGradient id="hero-name-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="50%" style="stop-color:#60a5fa" />
      <stop offset="100%" style="stop-color:#93c5fd" />
    </linearGradient>

    <!-- Glow Effect -->
    
    <filter id="hero-glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    

    <!-- Avatar Clip -->
    <clipPath id="hero-avatar-clip">
      <circle cx="1300" cy="400" r="180"/>
    </clipPath>

    <!-- Decorative Circle Clip -->
    <clipPath id="hero-deco-clip">
      <circle cx="1300" cy="400" r="220"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1600" height="800" fill="url(#hero-bg-gradient)" rx="16"/>

  <!-- Decorative Background Elements (Anime-inspired) -->
  <circle cx="1300" cy="400" r="280" fill="#3b82f6" opacity="0.03" />
  <circle cx="1300" cy="400" r="240" fill="#60a5fa" opacity="0.05" />
  <circle cx="150" cy="150" r="100" fill="#93c5fd" opacity="0.02" />
  <circle cx="200" cy="650" r="80" fill="#3b82f6" opacity="0.02" />

  <!-- Character/Avatar Section (Right Side) -->
  <!-- Decorative Ring -->
  <circle 
    cx="1300" 
    cy="400" 
    r="220" 
    fill="none" 
    stroke="#3b82f6" 
    stroke-width="3" 
    opacity="0.2"
    filter="url(#hero-glow)"
  />
  
  <!-- Avatar Background Glow -->
  <circle 
    cx="1300" 
    cy="400" 
    r="200" 
    fill="#3b82f6" 
    opacity="0.1"
    filter="url(#hero-glow)"
  />
  
  <!-- Avatar Image -->
  <image 
    href="https://avatars.githubusercontent.com/u/182469784?v=4" 
    x="1120" 
    y="220" 
    width="360" 
    height="360" 
    clip-path="url(#hero-avatar-clip)"
    opacity="0.95"
  />

  <!-- Content Section (Left Side) -->
  <g transform="translate(80, 200)">
    
    <!-- Large Name (Magazine Style) -->
    <text 
      x="0" 
      y="0" 
      font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
      font-size="96" 
      font-weight="900" 
      fill="url(#hero-name-gradient)"
      letter-spacing="-4"
      filter="url(#hero-glow)"
    >
      KALASH MISHRA
    </text>

    <!-- Roles (Under Name) -->
    
    <text 
      x="0" 
      y="80" 
      font-family="'Inter', sans-serif" 
      font-size="28" 
      font-weight="500" 
      fill="#cbd5e1"
      letter-spacing="-1"
    >
      Software Engineer
    </text>
    
    <text 
      x="0" 
      y="120" 
      font-family="'Inter', sans-serif" 
      font-size="28" 
      font-weight="500" 
      fill="#cbd5e1"
      letter-spacing="-1"
    >
      Open Source Contributor
    </text>
    
    <text 
      x="0" 
      y="160" 
      font-family="'Inter', sans-serif" 
      font-size="28" 
      font-weight="500" 
      fill="#cbd5e1"
      letter-spacing="-1"
    >
      ML Engineer
    </text>
    

    <!-- About Section -->
    
    <text 
      x="0" 
      y="260" 
      font-family="'Inter', sans-serif" 
      font-size="20" 
      font-weight="400" 
      fill="#cbd5e1"
      opacity="0.9"
    >
      Passionate developer building AI tools, open source projects and beautiful devel
    </text>
    
    <text 
      x="0" 
      y="285" 
      font-family="'Inter', sans-serif" 
      font-size="20" 
      font-weight="400" 
      fill="#cbd5e1"
      opacity="0.9"
    >
      oper experiences.
    </text>
    
    

    <!-- Info Tags (Small Stats) -->
    <g transform="translate(0, 340)">
      
        <g transform="translate(0, 0)">
          <rect 
            x="0" 
            y="-20" 
            width="65" 
            height="28" 
            fill="#3b82f6" 
            opacity="0.1" 
            rx="6"
          />
          <text 
            x="10" 
            y="0" 
            font-family="'Inter', sans-serif" 
            font-size="14" 
            font-weight="500" 
            fill="#f1f5f9"
            opacity="0.8"
          >
            India
          </text>
        </g>
        
        <g transform="translate(280, 0)">
          <rect 
            x="0" 
            y="-20" 
            width="119" 
            height="28" 
            fill="#3b82f6" 
            opacity="0.1" 
            rx="6"
          />
          <text 
            x="10" 
            y="0" 
            font-family="'Inter', sans-serif" 
            font-size="14" 
            font-weight="500" 
            fill="#f1f5f9"
            opacity="0.8"
          >
            9 followers
          </text>
        </g>
        
        <g transform="translate(560, 0)">
          <rect 
            x="0" 
            y="-20" 
            width="92" 
            height="28" 
            fill="#3b82f6" 
            opacity="0.1" 
            rx="6"
          />
          <text 
            x="10" 
            y="0" 
            font-family="'Inter', sans-serif" 
            font-size="14" 
            font-weight="500" 
            fill="#f1f5f9"
            opacity="0.8"
          >
            11 repos
          </text>
        </g>
        
        <g transform="translate(0, 35)">
          <rect 
            x="0" 
            y="-20" 
            width="83" 
            height="28" 
            fill="#3b82f6" 
            opacity="0.1" 
            rx="6"
          />
          <text 
            x="10" 
            y="0" 
            font-family="'Inter', sans-serif" 
            font-size="14" 
            font-weight="500" 
            fill="#f1f5f9"
            opacity="0.8"
          >
            4 stars
          </text>
        </g>
        
        <g transform="translate(280, 35)">
          <rect 
            x="0" 
            y="-20" 
            width="182" 
            height="28" 
            fill="#3b82f6" 
            opacity="0.1" 
            rx="6"
          />
          <text 
            x="10" 
            y="0" 
            font-family="'Inter', sans-serif" 
            font-size="14" 
            font-weight="500" 
            fill="#f1f5f9"
            opacity="0.8"
          >
            2+ years on GitHub
          </text>
        </g>
        
    </g>

    <!-- Social Links -->
    <g transform="translate(0, 500)">
      
          <g transform="translate(0, 0)">
            <circle 
              cx="16" 
              cy="0" 
              r="20" 
              fill="#3b82f6" 
              opacity="0.15"
            />
            <text 
              x="16" 
              y="6" 
              font-family="'Inter', sans-serif" 
              font-size="16" 
              font-weight="600" 
              fill="#f1f5f9"
              text-anchor="middle"
            >
              G
            </text>
          </g>
          
          <g transform="translate(50, 0)">
            <circle 
              cx="16" 
              cy="0" 
              r="20" 
              fill="#3b82f6" 
              opacity="0.15"
            />
            <text 
              x="16" 
              y="6" 
              font-family="'Inter', sans-serif" 
              font-size="16" 
              font-weight="600" 
              fill="#f1f5f9"
              text-anchor="middle"
            >
              L
            </text>
          </g>
          
          <g transform="translate(100, 0)">
            <circle 
              cx="16" 
              cy="0" 
              r="20" 
              fill="#3b82f6" 
              opacity="0.15"
            />
            <text 
              x="16" 
              y="6" 
              font-family="'Inter', sans-serif" 
              font-size="16" 
              font-weight="600" 
              fill="#f1f5f9"
              text-anchor="middle"
            >
              T
            </text>
          </g>
          
          <g transform="translate(150, 0)">
            <circle 
              cx="16" 
              cy="0" 
              r="20" 
              fill="#3b82f6" 
              opacity="0.15"
            />
            <text 
              x="16" 
              y="6" 
              font-family="'Inter', sans-serif" 
              font-size="16" 
              font-weight="600" 
              fill="#f1f5f9"
              text-anchor="middle"
            >
              W
            </text>
          </g>
          
    </g>

  </g>

  <!-- Bottom Accent Line -->
  <line 
    x1="80" 
    y1="740" 
    x2="1520" 
    y2="740" 
    stroke="url(#hero-name-gradient)" 
    stroke-width="2" 
    opacity="0.3"
  />

  <!-- Username Tag (Bottom Right) -->
  <text 
    x="1520" 
    y="770" 
    font-family="'JetBrains Mono', 'Fira Code', monospace" 
    font-size="16" 
    font-weight="500" 
    fill="#cbd5e1"
    text-anchor="end"
  >
    @kalashmishra21
  </text>

</svg>