<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
<defs>

    <!-- Dynamic Radial Gradient Background -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1E2238" />
      <stop offset="60%" stop-color="#121524" />
      <stop offset="100%" stop-color="#090A0F" />
    </radialGradient>
    
    <!-- Static Neon Border Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Orb Gradients -->
    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F788" />
      <stop offset="100%" stop-color="#A855F700" />
    </radialGradient>
    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D488" />
      <stop offset="100%" stop-color="#06B6D400" />
    </radialGradient>
    <radialGradient id="orbGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec489988" />
      <stop offset="100%" stop-color="#ec489900" />
    </radialGradient>
  
<clipPath id="satori_bc-id"><path x="0" y="0" width="800" height="320" d="M20,0 h760 a20,20 0 0 1 20,20 v280 a20,20 0 0 1 -20,20 h-760 a20,20 0 0 1 -20,-20 v-280 a20,20 0 0 1 20,-20"/></clipPath>
</defs>

    <style>
      @keyframes float-slow {
        0%, 100% { transform: translateX(0px); opacity: 0.3; }
        50% { transform: translateX(350px); opacity: 0.8; }
      }
      @keyframes float-medium {
        0%, 100% { transform: translateX(0px); opacity: 0.3; }
        50% { transform: translateX(-250px); opacity: 0.6; }
      }
      @keyframes float-fast {
        0%, 100% { transform: translateX(0px); opacity: 0.4; }
        50% { transform: translateX(200px); opacity: 0.3; }
      }
      .orb-1 { animation: float-slow 8s ease-in-out infinite; }
      .orb-2 { animation: float-medium 12s ease-in-out infinite; }
      .orb-3 { animation: float-fast 9s ease-in-out infinite; }
      
      @keyframes border-pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .border-glow { animation: border-pulse 4s ease-in-out infinite; }
    </style>
  

    <!-- Full Background -->
    <rect width="800" height="320" fill="url(#spaceBg)" rx="12" />
    
    <!-- Static Top Border Glow Line -->
    <rect class="border-glow" x="0" y="0" width="800" height="2" fill="url(#borderGlow)" rx="1" />

    <!-- Animated Glowing Orbs -->
    <ellipse class="orb-1" cx="20%" cy="100%" rx="350" ry="250" fill="url(#orbGlow1)" />
    <ellipse class="orb-2" cx="80%" cy="0%" rx="400" ry="300" fill="url(#orbGlow2)" />
    <ellipse class="orb-3" cx="50%" cy="50%" rx="250" ry="200" fill="url(#orbGlow3)" />

    <!-- Floating Content Group -->
    <g>
  
