      <!-- Streak Section -->
      <g transform="translate(0, 336)">
        <!-- Streak Background -->
        <rect
          x="35"
          y="0"
          width="730"
          height="90"
          rx="15"
          fill="url(#streak-bg)"
          stroke="rgba(239, 68, 68, 0.2)"
          stroke-width="1"
        />
        
        <!-- Streak Title -->
        <text
          x="400"
          y="25"
          text-anchor="middle"
          font-family="'Inter', sans-serif"
          font-size="16"
          font-weight="700"
          fill="#f1f5f9"
        >
          🔥 Contribution Streaks
        </text>
        
        <!-- Current Streak -->
        <g transform="translate(217.5, 45)">
          <rect
            x="-80"
            y="0"
            width="160"
            height="55"
            rx="10"
            fill="rgba(239, 68, 68, 0.15)"
            stroke="rgba(239, 68, 68, 0.3)"
            stroke-width="1"
          >
            <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite" />
          </rect>
          
          <text
            x="0"
            y="15"
            text-anchor="middle"
            font-size="16"
          >
            🔥
          </text>
          
          <text
            x="0"
            y="35"
            text-anchor="middle"
            font-family="'Inter', sans-serif"
            font-size="20"
            font-weight="700"
            fill="#ef4444"
