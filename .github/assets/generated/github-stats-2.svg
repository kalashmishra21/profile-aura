            CURRENT STREAK
          </text>
        </g>
        
        <!-- Longest Streak -->
        <g transform="translate(582.5, 45)">
          <rect
            x="-80"
            y="0"
            width="160"
            height="55"
            rx="10"
            fill="rgba(139, 92, 246, 0.15)"
            stroke="rgba(139, 92, 246, 0.3)"
