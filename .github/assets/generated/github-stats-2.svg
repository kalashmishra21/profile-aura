<svg
      width="800"
      height="500"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="GitHub Statistics Card"
    >
      <defs>
        <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(15, 23, 42, 0.98)" />
          <stop offset="100%" stop-color="rgba(30, 41, 59, 0.98)" />
        </linearGradient>
        
        <linearGradient id="streak-bg" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="rgba(239, 68, 68, 0.15)" />
          <stop offset="100%" stop-color="rgba(139, 92, 246, 0.15)" />
        </linearGradient>
      </defs>

      <!-- Background -->
      <rect width="800" height="500" rx="20" fill="url(#card-bg)" />
      <rect width="800" height="500" rx="20" fill="none" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1" />

      <!-- Title -->
      <text
        x="400"
        y="45"
        text-anchor="middle"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="24"
        font-weight="800"
        fill="#f1f5f9"
      >
        📊 GitHub Statistics & Streaks
      </text>
      
      <text
        x="400"
        y="65"
        text-anchor="middle"
        font-family="'Inter', sans-serif"
        font-size="13"
        fill="rgba(148, 163, 184, 0.7)"
      >
        Complete development metrics
      </text>

      <!-- Main Stats Grid -->
      
        <g class="stat-box" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0s" fill="freeze" />
          
          <!-- Box Background -->
          <rect
            x="35"
            y="85"
            width="230"
            height="95"
            rx="12"
            fill="rgba(51, 65, 85, 0.5)"
            stroke="rgba(148, 163, 184, 0.15)"
            stroke-width="1"
          />
          
          <!-- Icon -->
          <text
            x="150"
            y="115"
            text-anchor="middle"
            font-size="20"
          >
            📊
          </text>
          
          <!-- Value -->
          <text
            x="150"
            y="140"
            text-anchor="middle"
            font-family="'Inter', sans-serif"
            font-size="22"
            font-weight="700"
            fill="#10b981"
          >
            154
            <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
          </text>
          
          <!-- Label -->
          <text
            x="150"
            y="160"
            text-anchor="middle"
            font-family="'Inter', sans-serif"
            font-size="10"
            font-weight="600"
            letter-spacing="0.5"
            fill="rgba(148, 163, 184, 0.7)"
          >
            TOTAL CONTRIBUTIONS
          </text>
        </g>
        
        <g class="stat-box" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.1s" fill="freeze" />
          
